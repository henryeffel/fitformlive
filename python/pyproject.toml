[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitform-eval"
version = "0.1.0"
description = "Python validation and cycle-level analysis for FitForm Live"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
annotation = ["streamlit>=1.37"]

[project.scripts]
fitform-eval = "fitform_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
